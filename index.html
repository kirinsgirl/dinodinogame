<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chrome Dino — Gesture-Controlled Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="scene">

    <header class="hud">
      <div class="hud-block">
        <span class="hud-label">SCORE</span>
        <span id="score" class="hud-value">00000</span>
      </div>
      <h1 class="title">CHROME&nbsp;DINO</h1>
      <div class="hud-block">
        <span class="hud-label">BEST</span>
        <span id="best" class="hud-value">00000</span>
      </div>
    </header>

    <main class="stage">
      <canvas id="game" width="900" height="300"></canvas>

      <!-- Overlay screens -->
      <div id="overlay" class="overlay">
        <div class="overlay-card">
          <p id="overlayTitle" class="overlay-title">SHOW ☝️ TO START</p>
          <p id="overlaySub" class="overlay-sub">Hold up your index finger to the camera</p>
        </div>
      </div>
    </main>

    <section class="gesture-guide">
      <div class="guide-item">
        <div class="guide-hand">☝️</div>
        <div class="guide-text">
          <strong>Index finger</strong>
          <span>Start / Restart</span>
        </div>
      </div>
      <div class="guide-divider" aria-hidden="true"></div>
      <div class="guide-item">
        <div class="guide-hand">✌️</div>
        <div class="guide-text">
          <strong>Index + middle</strong>
          <span>Jump</span>
        </div>
      </div>
    </section>

    <!-- CRT-style webcam viewfinder, the "controller" -->
    <div class="viewfinder" id="viewfinder">
      <div class="viewfinder-label">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">INITIALIZING CAMERA…</span>
      </div>
      <div class="viewfinder-screen">
        <video id="inputVideo" playsinline autoplay muted></video>
        <canvas id="handCanvas"></canvas>
        <div class="scanlines" aria-hidden="true"></div>
      </div>
      <div class="viewfinder-gesture" id="gestureReadout">— NO HAND —</div>
    </div>

  </div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="game.js"></script>
<script src="hand-control.js"></script>
</body>
</html>
